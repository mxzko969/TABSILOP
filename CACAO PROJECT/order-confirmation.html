<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed - Tabsilop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Order Confirmed</h1>
      <p>Your cacao bundle has been scheduled. Review the details below and keep this page for your reference.</p>
    </div>
    <div class="page-actions">
      <a href="index.html" class="secondary-button">Place Another Order</a>
      <a href="profile.html" class="secondary-button">My Profile</a>
    </div>
  </header>

  <main class="container confirmation-container">
    <section class="summary-card confirmation-card">
      <h2>Receipt</h2>
      <div id="confirmationDetails">
        <p class="form-note">Loading order details...</p>
      </div>
    </section>

  <footer class="footer">
    <p>Thank you for ordering from Tabsilop.</p>
  </footer>

  <script src="order-confirmation.js"></script>

</html>
